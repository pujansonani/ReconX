services:
  # Backend API Service
  - type: web
    name: reconx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AMOUNT_TOLERANCE
        value: "0.01"
      - key: DATE_WINDOW_DAYS
        value: "3"
      - key: DEFAULT_GST_RATE
        value: "0.18"
      - key: DATABASE_URL
        value: sqlite:///./reconx.db
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Web App
  - type: web
    name: reconx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: reconx-backend
          property: host
