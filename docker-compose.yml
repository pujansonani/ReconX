version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconx-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AMOUNT_TOLERANCE=0.01
      - DATE_WINDOW_DAYS=3
      - DEFAULT_GST_RATE=0.18
      - DATABASE_URL=sqlite:////app/data/reconx.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconx-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
